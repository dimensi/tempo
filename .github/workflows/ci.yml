name: CI
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  docker:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build exact checked-out revision
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          docker build -t nutrition-foundation \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.tree=$(git rev-parse HEAD^{tree})" .
      - name: Publish built image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          set +x
          export DOCKER_CONFIG=$(mktemp -d)
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_SHA"
          docker tag nutrition-foundation "$image"
          docker push "$image"
