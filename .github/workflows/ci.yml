name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Exhaustive production regression (manual only)
        required: true
        type: choice
        options: [full]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Select authoritative changed areas
        env:
          CI_BEFORE: ${{ github.event.before }}
          CI_MODE: ${{ github.event_name == 'workflow_dispatch' && 'full' || 'selected' }}
        run: node scripts/ci/select.mjs
      - run: pnpm test:ci:selection
      - run: pnpm format:check
      - name: Verify constrained CD protocol and recovery guards
        run: python3 scripts/cd/test-cd-candidates.py
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm exec playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core poppler-utils
      - run: pnpm test
      - run: pnpm build
      - name: Mandatory production smoke and selected or manual-full area gates
        run: pnpm test:ci:browsers
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: test-results/
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build exact checked-out revision
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          docker build -t nutrition-foundation \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.tree=$(git rev-parse HEAD^{tree})" .
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: bash scripts/docker-smoke.sh
      - name: Export tested release image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bash scripts/export-release-artifact.sh
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: nutrition-release-${{ github.sha }}
          path: release-artifact/
          retention-days: 7
          if-no-files-found: error
