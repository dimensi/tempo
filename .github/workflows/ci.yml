name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Exhaustive production regression (manual only)
        required: true
        type: choice
        options: [full]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Select authoritative changed areas
        env:
          CI_BEFORE: ${{ github.event.before }}
          CI_MODE: ${{ github.event_name == 'workflow_dispatch' && 'full' || 'selected' }}
        run: node scripts/ci/select.mjs
      - run: pnpm test:ci:selection
      - run: pnpm format:check
      - name: Verify constrained CD protocol and recovery guards
        run: python3 scripts/cd/test-cd-candidates.py
      - name: Verify inline SSH deployment and configuration
        run: python3 scripts/cd/test-simple-deploy.py
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm exec playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core poppler-utils
      - run: pnpm test
      - run: pnpm build
      - name: Mandatory production smoke and selected or manual-full area gates
        env:
          CI_E2E_CONCURRENCY: 2
        run: pnpm test:ci:browsers
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: e2e-results
          path: test-results/
  docker:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build exact checked-out revision
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          docker build -t nutrition-foundation \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.tree=$(git rev-parse HEAD^{tree})" .
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: bash scripts/docker-smoke.sh
      - name: Publish tested image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          set +x
          export DOCKER_CONFIG=$(mktemp -d)
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_SHA"
          docker tag nutrition-foundation "$image"
          docker push "$image"
