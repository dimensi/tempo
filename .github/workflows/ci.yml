name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - name: Verify constrained CD protocol and recovery guards
        run: python3 scripts/cd/test-cd-candidates.py
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm exec playwright install --with-deps chromium
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core poppler-utils
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - run: pnpm test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - run: pnpm build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - run: pnpm test:e2e
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - run: pnpm test:e2e --config tests/nutrition-sync/e2e.config.ts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - run: pnpm test:e2e --config tests/transformmate-sync/e2e.config.ts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - uses: actions/upload-artifact@v4
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: e2e-results
          path: test-results/
  docker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build exact checked-out revision
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          docker build -t nutrition-foundation \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.tree=$(git rev-parse HEAD^{tree})" .
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: bash scripts/docker-smoke.sh
      - name: Export tested release image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bash scripts/export-release-artifact.sh
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: nutrition-release-${{ github.sha }}
          path: release-artifact/
          retention-days: 7
          if-no-files-found: error
