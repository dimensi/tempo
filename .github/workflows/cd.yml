name: Nutrition CD
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful main CI run ID
        required: true
      revision:
        description: Exact 40-character main Git SHA
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: nutrition-production
  cancel-in-progress: false
jobs:
  deploy:
    # Off until the approved host installation and secure key handoff are verified.
    if: ${{ vars.NUTRITION_CD_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')) }}
    runs-on: ubuntu-24.04
    environment: nutrition-production
    steps:
      - name: Require authoritative successful main CI
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
          REVISION: ${{ inputs.revision || github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ && "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          umask 077
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" > jobs.json
          python3 - <<'PYVERIFY'
          import json, os
          run = json.load(open('run.json'))
          assert run['event'] == 'push' and run['head_branch'] == 'main'
          assert run['head_sha'] == os.environ['REVISION']
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          jobs = json.load(open('jobs.json'))['jobs']
          for name in ('checks', 'docker'):
              found = [j for j in jobs if j['name'] == name]
              assert len(found) == 1 and found[0]['status'] == 'completed' and found[0]['conclusion'] == 'success'
          PYVERIFY
      - uses: actions/download-artifact@v8.0.2
        with:
          name: nutrition-release-${{ inputs.revision || github.event.workflow_run.head_sha }}
          run-id: ${{ inputs.run_id || github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: release-artifact
      - name: Verify archive and Git tree
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ inputs.revision || github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          export EXPECTED_TREE=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$REVISION" --jq '.tree.sha')
          python3 - <<'PYVERIFY'
          import hashlib, json, os
          m = json.load(open('release-artifact/manifest.json'))
          assert m['revision'] == os.environ['REVISION'] and m['tree'] == os.environ['EXPECTED_TREE']
          assert m['imageTag'] == 'nutrition-release:' + m['revision'][:12]
          h = hashlib.sha256()
          with open('release-artifact/image.tar.gz', 'rb') as f:
              for chunk in iter(lambda: f.read(1048576), b''): h.update(chunk)
          assert h.hexdigest() == m['archiveSHA256']
          PYVERIFY
      - name: Invoke constrained deployment (candidate protocol)
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_KEY: ${{ secrets.NUTRITION_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ vars.NUTRITION_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.NUTRITION_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.NUTRITION_DEPLOY_USER }}
          REVISION: ${{ inputs.revision || github.event.workflow_run.head_sha }}
          RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_REGION: ${{ vars.S3_REGION }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          ANAMNESIS_LLM_API_KEY: ${{ secrets.ANAMNESIS_LLM_API_KEY }}
          ANAMNESIS_LLM_BASE_URL: ${{ vars.ANAMNESIS_LLM_BASE_URL }}
          ANAMNESIS_LLM_MODEL: ${{ vars.ANAMNESIS_LLM_MODEL }}
          ANAMNESIS_LLM_TIMEOUT_MS: ${{ vars.ANAMNESIS_LLM_TIMEOUT_MS }}
          ENABLE_ANAMNESIS_WORKER: ${{ vars.ENABLE_ANAMNESIS_WORKER }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ && "$DEPLOY_USER" == nutrition-deploy ]]
          key=$(mktemp)
          hosts=$(mktemp)
          config_dir=$(mktemp -d "$RUNNER_TEMP/nutrition-runtime.XXXXXX")
          trap 'rm -f "$key" "$hosts"; rm -rf "$config_dir"' EXIT
          export RUNTIME_CONFIG_PATH="$config_dir/runtime-config.json"
          python3 - <<'PYCONFIG'
          import json, os
          keys = ('S3_ENDPOINT', 'S3_REGION', 'S3_BUCKET', 'S3_ACCESS_KEY_ID',
                  'S3_SECRET_ACCESS_KEY', 'ANAMNESIS_LLM_API_KEY', 'ANAMNESIS_LLM_BASE_URL',
                  'ANAMNESIS_LLM_MODEL', 'ANAMNESIS_LLM_TIMEOUT_MS', 'ENABLE_ANAMNESIS_WORKER')
          values = {key: os.environ[key] for key in keys}
          assert all(0 < len(value) <= 2048 and all(32 <= ord(c) <= 126 and c not in "'\\" for c in value) for value in values.values()), 'Runtime configuration rejected'
          payload = json.dumps({'version': 2, 'runtime': values}).encode('ascii')
          assert len(payload) <= 16384, 'Runtime configuration rejected'
          with open(os.environ['RUNTIME_CONFIG_PATH'], 'xb') as f:
              f.write(payload)
          PYCONFIG
          unset S3_ENDPOINT S3_REGION S3_BUCKET S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY ANAMNESIS_LLM_API_KEY ANAMNESIS_LLM_BASE_URL ANAMNESIS_LLM_MODEL ANAMNESIS_LLM_TIMEOUT_MS ENABLE_ANAMNESIS_WORKER RUNTIME_CONFIG_PATH
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          printf '%s\n' "$KNOWN_HOSTS" > "$hosts"
          unset DEPLOY_KEY KNOWN_HOSTS
          tree=$(python3 -c 'import json; print(json.load(open("release-artifact/manifest.json"))["tree"])')
          digest=$(python3 -c 'import json; print(json.load(open("release-artifact/manifest.json"))["archiveSHA256"])')
          current_main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          [[ "$current_main" == "$REVISION" ]] || { echo 'Stale main revision refused.' >&2; exit 1; }
          tar --format=ustar -cf - -C "$config_dir" runtime-config.json -C "$GITHUB_WORKSPACE/release-artifact" manifest.json image.tar.gz | ssh -p 2224 -i "$key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts" -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" "nutrition-release $RUN_ID $REVISION $tree $digest"
