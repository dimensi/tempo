name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'nutrition-production' || format('nutrition-build-{0}', github.ref) }}
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set image metadata
        id: revision
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/tempo-docker" >> "$GITHUB_ENV"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            echo 'tag=latest' >> "$GITHUB_OUTPUT"
          else
            branch_key=$(printf '%s' "$GITHUB_REF" | sha256sum | cut -c 1-16)
            echo "tag=build-$branch_key" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push image
        uses: docker/build-push-action@v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          push: true
          tags: |
            ${{ steps.revision.outputs.image }}:${{ steps.revision.outputs.tag }}
            ${{ steps.revision.outputs.image }}:${{ github.sha }}
            ${{ steps.revision.outputs.image }}:buildcache
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.tree=${{ steps.revision.outputs.tree }}
          cache-from: |
            type=registry,ref=${{ steps.revision.outputs.image }}:${{ steps.revision.outputs.tag }}
            type=registry,ref=${{ steps.revision.outputs.image }}:buildcache
            type=registry,ref=${{ steps.revision.outputs.image }}:latest
          cache-to: type=inline
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Deploy published image through Coolify
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          DEPLOY_SHA: ${{ github.sha }}
          HEALTH_URL: https://tempo.dimensi.dev/api/health
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          base = os.environ["COOLIFY_URL"].rstrip("/") + "/api/v1"
          application = os.environ["COOLIFY_APP_UUID"]
          revision = os.environ["DEPLOY_SHA"]

          def api(method, path, data=None):
              request = urllib.request.Request(
                  base + path,
                  method=method,
                  data=json.dumps(data).encode() if data is not None else None,
                  headers={
                      "Authorization": "Bearer " + os.environ["COOLIFY_TOKEN"],
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  raise RuntimeError(f"Coolify request failed with HTTP {error.code}") from None

          api(
              "PATCH",
              "/applications/" + application + "/envs",
              {
                  "key": "DEPLOYED_COMMIT",
                  "value": revision,
                  "is_preview": False,
                  "is_literal": True,
                  "is_runtime": True,
                  "is_buildtime": False,
              },
          )
          api("PATCH", "/applications/" + application, {"docker_registry_image_tag": revision})
          deployment = api("POST", "/deploy", {"uuid": application})["deployments"][0]["deployment_uuid"]
          for attempt in range(120):
              status = api("GET", "/deployments/" + deployment)["status"]
              if status == "finished":
                  break
              if status in {"failed", "cancelled", "cancelled-by-user"}:
                  raise RuntimeError("Coolify deployment " + status)
              time.sleep(5)
          else:
              raise RuntimeError("Timed out waiting for Coolify deployment")

          application_state = api("GET", "/applications/" + application)
          if application_state["docker_registry_image_tag"] != revision:
              raise RuntimeError("Coolify application image tag does not match the release revision")

          for attempt in range(30):
              try:
                  with urllib.request.urlopen(os.environ["HEALTH_URL"], timeout=10) as response:
                      if response.status == 200:
                          break
              except urllib.error.URLError:
                  pass
              if attempt == 29:
                  raise RuntimeError("Public health check did not become ready")
              time.sleep(2)

          print("Coolify deployed and verified revision " + revision)
          PY
