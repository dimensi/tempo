name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'nutrition-production' || format('nutrition-build-{0}', github.ref) }}
  cancel-in-progress: true
jobs:
  build:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.revision.outputs.image }}@${{ steps.publish.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set image metadata
        id: revision
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/tempo-docker" >> "$GITHUB_ENV"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            echo 'tag=latest' >> "$GITHUB_OUTPUT"
          else
            branch_key=$(printf '%s' "$GITHUB_REF" | sha256sum | cut -c 1-16)
            echo "tag=build-$branch_key" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Select application build or image reuse
        id: application
        env:
          IMAGE: ${{ steps.revision.outputs.image }}
        run: |
          set -euo pipefail
          paths=(Dockerfile .dockerignore)
          while IFS= read -r rule || [[ -n "$rule" ]]; do
            case "$rule" in
              ''|\#*|'**') ;;
              '!'*) paths+=(":(top,glob)${rule:1}") ;;
              *) paths+=(":(top,exclude,glob)$rule") ;;
            esac
          done < .dockerignore
          base=$(sed -n 's/^ARG NODE_IMAGE=//p' Dockerfile)
          base_digest=$(docker buildx imagetools inspect "$base" --format '{{.Manifest.Digest}}')
          [[ "$base_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "base=$base@$base_digest" >> "$GITHUB_OUTPUT"
          inputs=$({ printf '%s\n' "$base_digest"; git ls-files --stage -- "${paths[@]}"; } | sha256sum | cut -d' ' -f1)
          echo "inputs=$inputs" >> "$GITHUB_OUTPUT"
          cached="$IMAGE:inputs-$inputs"
          if metadata=$(docker buildx imagetools inspect "$cached" --format '{{.Manifest.Digest}} {{index .Image.Config.Labels "dev.tempo.build-inputs"}}' 2>/dev/null); then
            read -r digest recorded_inputs <<< "$metadata"
            if [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ && "$recorded_inputs" == "$inputs" ]]; then
              echo 'target=reuse' >> "$GITHUB_OUTPUT"
              echo "application=$IMAGE@$digest" >> "$GITHUB_OUTPUT"
              echo 'Application inputs unchanged; reusing the published image.'
              exit 0
            fi
          fi
          echo 'target=runtime' >> "$GITHUB_OUTPUT"
          echo "cache-tag=$IMAGE:buildcache" >> "$GITHUB_OUTPUT"
          echo 'Application inputs changed or image missing; building the application.'
      - name: Build and push image
        id: publish
        uses: docker/build-push-action@v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          push: true
          target: ${{ steps.application.outputs.target }}
          build-args: |
            NODE_IMAGE=${{ steps.application.outputs.base }}
            APPLICATION_IMAGE=${{ steps.application.outputs.application || steps.application.outputs.base }}
          tags: |
            ${{ steps.revision.outputs.image }}:${{ steps.revision.outputs.tag }}
            ${{ steps.revision.outputs.image }}:inputs-${{ steps.application.outputs.inputs }}
            ${{ steps.application.outputs.cache-tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.tree=${{ steps.revision.outputs.tree }}
            dev.tempo.build-inputs=${{ steps.application.outputs.inputs }}
          cache-from: |
            type=registry,ref=${{ steps.revision.outputs.image }}:${{ steps.revision.outputs.tag }}
            type=registry,ref=${{ steps.revision.outputs.image }}:buildcache
            type=registry,ref=${{ steps.revision.outputs.image }}:latest
          cache-to: type=inline
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: nutrition-production
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Copy env and Compose, then pull and start over SSH
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_KEY: ${{ secrets.NUTRITION_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.NUTRITION_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.NUTRITION_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.NUTRITION_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.NUTRITION_DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.NUTRITION_DEPLOY_PATH }}
          DEPLOY_PROJECT: ${{ secrets.NUTRITION_DEPLOY_PROJECT }}
          DEPLOY_HEALTH_URL: ${{ secrets.NUTRITION_DEPLOY_HEALTH_URL }}
          APPROVED_RUNTIME_SHA256: ${{ secrets.NUTRITION_DEPLOY_RUNTIME_SHA256 }}
          IMAGE_REF: ${{ needs.build.outputs.image }}
          REVISION: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANAMNESIS_LLM_BASE_URL: ${{ secrets.ANAMNESIS_LLM_BASE_URL }}
          ANAMNESIS_LLM_MODEL: ${{ secrets.ANAMNESIS_LLM_MODEL }}
          ANAMNESIS_LLM_TIMEOUT_MS: ${{ secrets.ANAMNESIS_LLM_TIMEOUT_MS }}
          ENABLE_ANAMNESIS_WORKER: ${{ secrets.ENABLE_ANAMNESIS_WORKER }}
        run: |
          set -euo pipefail
          set +x
          log=$(mktemp "$RUNNER_TEMP/tempo-deploy-output.XXXXXX")
          export DEPLOY_PHASE_FILE=$(mktemp "$RUNNER_TEMP/tempo-deploy-phase.XXXXXX")
          trap 'rm -f "$log" "$DEPLOY_PHASE_FILE"' EXIT
          if bash scripts/cd/deploy.sh >"$log" 2>&1; then
            echo 'Deployment completed; revision and health verified.'
          else
            phase=$(cat "$DEPLOY_PHASE_FILE")
            case "$phase" in
              configuration|revision|connection|transfer|rollout) ;;
              *) phase=initialization ;;
            esac
            printf '::error::Deployment failed during %s; infrastructure output withheld.\n' "$phase"
            exit 1
          fi
