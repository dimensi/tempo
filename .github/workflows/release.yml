name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nutrition-production
  cancel-in-progress: true
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.revision.outputs.image }}@${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify exact checked-out revision
        id: revision
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/tempo-docker" >> "$GITHUB_ENV"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish cached image to GHCR
        id: publish
        uses: docker/build-push-action@v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          push: true
          tags: ${{ steps.revision.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.tree=${{ steps.revision.outputs.tree }}
          cache-from: type=gha,version=2,scope=tempo-linux-amd64
          cache-to: type=gha,version=2,scope=tempo-linux-amd64,mode=max,timeout=2m,ignore-error=true
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: nutrition-production
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Copy env and Compose, then pull and start over SSH
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_KEY: ${{ secrets.NUTRITION_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.NUTRITION_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.NUTRITION_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.NUTRITION_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.NUTRITION_DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.NUTRITION_DEPLOY_PATH }}
          DEPLOY_PROJECT: ${{ secrets.NUTRITION_DEPLOY_PROJECT }}
          DEPLOY_HEALTH_URL: ${{ secrets.NUTRITION_DEPLOY_HEALTH_URL }}
          APPROVED_RUNTIME_SHA256: ${{ secrets.NUTRITION_DEPLOY_RUNTIME_SHA256 }}
          IMAGE_REF: ${{ needs.build.outputs.image }}
          REVISION: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANAMNESIS_LLM_BASE_URL: ${{ secrets.ANAMNESIS_LLM_BASE_URL }}
          ANAMNESIS_LLM_MODEL: ${{ secrets.ANAMNESIS_LLM_MODEL }}
          ANAMNESIS_LLM_TIMEOUT_MS: ${{ secrets.ANAMNESIS_LLM_TIMEOUT_MS }}
          ENABLE_ANAMNESIS_WORKER: ${{ secrets.ENABLE_ANAMNESIS_WORKER }}
        run: |
          set -euo pipefail
          set +x
          log=$(mktemp "$RUNNER_TEMP/tempo-deploy-output.XXXXXX")
          export DEPLOY_PHASE_FILE=$(mktemp "$RUNNER_TEMP/tempo-deploy-phase.XXXXXX")
          trap 'rm -f "$log" "$DEPLOY_PHASE_FILE"' EXIT
          if bash scripts/cd/deploy.sh >"$log" 2>&1; then
            echo 'Deployment completed; revision and health verified.'
          else
            phase=$(cat "$DEPLOY_PHASE_FILE")
            case "$phase" in
              configuration|revision|connection|transfer|rollout) ;;
              *) phase=initialization ;;
            esac
            printf '::error::Deployment failed during %s; infrastructure output withheld.\n' "$phase"
            exit 1
          fi
