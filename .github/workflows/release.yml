name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nutrition-production
  cancel-in-progress: true
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Build exact checked-out revision
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          docker build -t nutrition-foundation \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.tree=$(git rev-parse HEAD^{tree})" .
      - name: Publish built image to GHCR
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          set +x
          export DOCKER_CONFIG=$(mktemp -d)
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          export IMAGE_REPOSITORY="ghcr.io/${GITHUB_REPOSITORY,,}"
          image="$IMAGE_REPOSITORY:latest"
          docker tag nutrition-foundation "$image"
          docker push "$image"
          export IMAGE_DIGESTS=$(docker image inspect "$image" --format '{{json .RepoDigests}}')
          python3 - <<'PYIMAGE'
          import json, os, re
          pattern = re.escape(os.environ['IMAGE_REPOSITORY']) + r'@sha256:[0-9a-f]{64}'
          refs = [ref for ref in json.loads(os.environ['IMAGE_DIGESTS']) if re.fullmatch(pattern, ref)]
          assert len(refs) == 1, 'Expected one published image digest'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'image={refs[0]}\n')
          PYIMAGE
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && vars.NUTRITION_CD_ENABLED == 'true'
    environment: nutrition-production
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Copy env and Compose, then pull and start over SSH
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_KEY: ${{ secrets.NUTRITION_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.NUTRITION_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.NUTRITION_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.NUTRITION_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.NUTRITION_DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.NUTRITION_DEPLOY_PATH }}
          DEPLOY_PROJECT: ${{ secrets.NUTRITION_DEPLOY_PROJECT }}
          DEPLOY_HEALTH_URL: ${{ secrets.NUTRITION_DEPLOY_HEALTH_URL }}
          APPROVED_RUNTIME_SHA256: ${{ secrets.NUTRITION_DEPLOY_RUNTIME_SHA256 }}
          IMAGE_REF: ${{ needs.build.outputs.image }}
          REVISION: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANAMNESIS_LLM_BASE_URL: ${{ secrets.ANAMNESIS_LLM_BASE_URL }}
          ANAMNESIS_LLM_MODEL: ${{ secrets.ANAMNESIS_LLM_MODEL }}
          ANAMNESIS_LLM_TIMEOUT_MS: ${{ secrets.ANAMNESIS_LLM_TIMEOUT_MS }}
          ENABLE_ANAMNESIS_WORKER: ${{ secrets.ENABLE_ANAMNESIS_WORKER }}
        run: |
          set -euo pipefail
          set +x
          log=$(mktemp "$RUNNER_TEMP/tempo-deploy-output.XXXXXX")
          export DEPLOY_PHASE_FILE=$(mktemp "$RUNNER_TEMP/tempo-deploy-phase.XXXXXX")
          trap 'rm -f "$log" "$DEPLOY_PHASE_FILE"' EXIT
          if bash scripts/cd/deploy.sh >"$log" 2>&1; then
            echo 'Deployment completed; revision and health verified.'
          else
            phase=$(cat "$DEPLOY_PHASE_FILE")
            case "$phase" in
              configuration|revision|connection|transfer|rollout) ;;
              *) phase=initialization ;;
            esac
            printf '::error::Deployment failed during %s; infrastructure output withheld.\n' "$phase"
            exit 1
          fi
