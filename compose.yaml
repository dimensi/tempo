services:
  app:
    build: .
    image: ghcr.io/dimensi/tempo:latest
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: file:/app/data/nutrition.sqlite
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://nutrition.dimensi.dev}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set a strong BETTER_AUTH_SECRET}
      UPLOADS_DIR: /app/uploads
      DEMO_MODE: 'false'
      YAZIO_TOKEN_FILE: ${YAZIO_TOKEN_FILE:-}
      ENABLE_NUTRITION_SCHEDULER: ${ENABLE_NUTRITION_SCHEDULER:-false}
      TRANSFORMMATE_TOKEN_FILE: ${TRANSFORMMATE_TOKEN_FILE:-/app/data/transformmate-token.json}
      # Объектное хранилище анамнеза: пустые значения по умолчанию держат
      # локальный fs-режим в UPLOADS_DIR (см. docs/architecture/anamnesis-storage.md).
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-apps}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      # Провайдер распознавания: без ключа внешняя обработка не выполняется.
      ANAMNESIS_LLM_BASE_URL: ${ANAMNESIS_LLM_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANAMNESIS_LLM_MODEL: ${ANAMNESIS_LLM_MODEL:-google/gemini-3.8-flash}
      ANAMNESIS_LLM_TIMEOUT_MS: ${ANAMNESIS_LLM_TIMEOUT_MS:-120000}
      # Только периодический таймер очереди; загрузка/переобработка запускают
      # обработку напрямую и без таймера.
      ENABLE_ANAMNESIS_WORKER: ${ENABLE_ANAMNESIS_WORKER:-false}
    volumes:
      - database:/app/data
      - uploads:/app/uploads
    ports:
      - '127.0.0.1:${APP_PORT:-3000}:3000'
volumes:
  database:
  uploads:
